plugins {
    id 'java'
    id 'application'
}

group = 'dev.oxpecker'
version = '0.1.0'

repositories {
    mavenLocal()   // Rhino built from ../rhino at the pinned commit: ./gradlew :rhino:publishToMavenLocal
    mavenCentral()
}

configurations {
    jacocoAgent
}

dependencies {
    implementation "org.mozilla:rhino:${rhinoVersion}"
    implementation 'com.google.code.gson:gson:2.11.0'
    // Coverage of Rhino itself (brief §9.9): the agent is attached by bin/harness when
    // OXPECKER_COVERAGE=1; core analyses the exec data against the Rhino classes.
    implementation 'org.jacoco:org.jacoco.core:0.8.12'
    compileOnly 'org.jacoco:org.jacoco.agent:0.8.12:runtime'
    jacocoAgent 'org.jacoco:org.jacoco.agent:0.8.12:runtime'
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

application {
    mainClass = 'dev.oxpecker.harness.Harness'
}

// Single runnable jar: java -jar build/libs/oxpecker-harness-all.jar --replay case.js
tasks.register('fatJar', Jar) {
    archiveBaseName = 'oxpecker-harness'
    archiveClassifier = 'all'
    archiveVersion = ''
    manifest { attributes 'Main-Class': 'dev.oxpecker.harness.Harness' }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('jacocoAgentJar', Copy) {
    from configurations.jacocoAgent
    into layout.buildDirectory.dir('libs')
    rename { 'jacocoagent.jar' }
}
tasks.named('fatJar') { dependsOn 'jacocoAgentJar' }

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging { events 'failed'; exceptionFormat 'full' }
}
