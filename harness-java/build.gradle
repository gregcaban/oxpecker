plugins {
    id 'java'
    id 'application'
}

group = 'dev.oxpecker'
version = '0.1.0'

repositories {
    mavenLocal()   // Rhino built from ../rhino at the pinned commit: ./gradlew :rhino:publishToMavenLocal
    mavenCentral()
}

configurations {
    jacocoAgent
}

dependencies {
    // -PrhinoJar=PATH runs a locally built Rhino (e.g. master) instead of the published one;
    // name it with -PrhinoVersion=... so the harness reports what it runs.
    if (project.hasProperty('rhinoJar')) {
        implementation files(project.property('rhinoJar'))
    } else {
        implementation "org.mozilla:rhino:${rhinoVersion}"
    }
    implementation 'com.google.code.gson:gson:2.11.0'
    // Coverage of Rhino itself (brief §9.9): the agent is attached by bin/harness when
    // OXPECKER_COVERAGE=1; core analyses the exec data against the Rhino classes.
    implementation 'org.jacoco:org.jacoco.core:0.8.12'
    compileOnly 'org.jacoco:org.jacoco.agent:0.8.12:runtime'
    jacocoAgent 'org.jacoco:org.jacoco.agent:0.8.12:runtime'
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Calls that take a scope are compiled per Rhino API line (Scopes.java): 1.x, or 2.0 (master
// since 04729d7e2, scopes are VarScope). Chosen from rhinoVersion; -PrhinoApi=1|2 overrides.
def rhinoApi = project.findProperty('rhinoApi') ?: (rhinoVersion.startsWith('1.') ? '1' : '2')
sourceSets.main.java.srcDir "src/rhino${rhinoApi}/java"

application {
    mainClass = 'dev.oxpecker.harness.Harness'
}

// Single runnable jar: java -jar build/libs/oxpecker-harness-all.jar --replay case.js
tasks.register('fatJar', Jar) {
    // -PharnessJar=harness-NAME.jar: one jar per Rhino target side by side (oxpecker build-harness)
    archiveFileName = project.findProperty('harnessJar') ?: 'oxpecker-harness-all.jar'
    manifest { attributes 'Main-Class': 'dev.oxpecker.harness.Harness', 'Rhino-Version': rhinoVersion }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('jacocoAgentJar', Copy) {
    from configurations.jacocoAgent
    into layout.buildDirectory.dir('libs')
    rename { 'jacocoagent.jar' }
}
tasks.named('fatJar') { dependsOn 'jacocoAgentJar' }

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging { events 'failed'; exceptionFormat 'full' }
}
