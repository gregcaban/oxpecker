# Rhino master (2.0.0-SNAPSHOT) needs Java 21. Point Gradle at it explicitly so
# `./gradlew` works regardless of the shell's default JDK.
org.gradle.java.home=/usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.jvmargs=-Xmx1g

# Rhino under test. Any version resolvable from mavenLocal (built from ../rhino via
# `./gradlew :rhino:publishToMavenLocal`) or Maven Central. Version-sensitive calls are
# isolated in RhinoCompat.java; the harness targets the 2.0 API line (VarScope/TopLevel).
rhinoVersion=2.0.0-SNAPSHOT
