# The harness is compiled for Java 21 (Rhino master needs it; 1.9.x runs on it). Point Gradle
# at it explicitly so `./gradlew` works regardless of the shell's default JDK.
org.gradle.java.home=/usr/local/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.jvmargs=-Xmx1g

# Rhino under test. Any version resolvable from mavenLocal (built from ../rhino via
# `./gradlew :rhino:publishToMavenLocal`) or Maven Central. Version-sensitive calls are
# isolated in RhinoCompat.java (evaluation mode, the 2.0 line's scope/global-this split).
# 1.9.2 is the latest release (2026-10-27); master was 2.0.0-SNAPSHOT at b95f75d.
rhinoVersion=1.9.2
