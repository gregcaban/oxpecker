<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="An oxpecker perched on a rhino">
  <title>oxpecker</title>
  <defs>
    <style>
      .rhino { fill: #6b7280; }
      .rhino-dark { fill: #4b5563; }
      .horn { fill: #d1d5db; }
      .bird { fill: #78350f; }
      .bird-belly { fill: #fde68a; }
      .beak { fill: #dc2626; }
      .eye { fill: #111827; }
      .eyering { fill: #fbbf24; }
      .ground { fill: #d6c9a8; }
      @media (prefers-color-scheme: dark) {
        .rhino { fill: #9ca3af; } .rhino-dark { fill: #6b7280; } .horn { fill: #e5e7eb; }
        .ground { fill: #44403c; }
      }
    </style>
  </defs>

  <!-- ground -->
  <ellipse class="ground" cx="160" cy="178" rx="140" ry="10"/>

  <!-- rhino body, facing left -->
  <path class="rhino" d="
    M 92 86
    C 60 86, 40 108, 40 134
    C 40 150, 50 160, 66 162
    L 240 162
    C 262 162, 276 148, 276 126
    C 276 104, 258 92, 236 92
    L 150 92
    C 132 80, 112 78, 92 86 Z"/>
  <!-- back hump -->
  <path class="rhino" d="M 150 92 C 170 72, 220 70, 236 92 Z"/>
  <!-- legs -->
  <rect class="rhino-dark" x="68" y="150" width="22" height="30" rx="5"/>
  <rect class="rhino-dark" x="104" y="150" width="22" height="30" rx="5"/>
  <rect class="rhino-dark" x="196" y="150" width="22" height="30" rx="5"/>
  <rect class="rhino-dark" x="232" y="150" width="22" height="30" rx="5"/>
  <!-- tail -->
  <path class="rhino-dark" d="M 274 120 C 290 124, 292 140, 282 150 C 288 138, 284 128, 272 126 Z"/>
  <!-- head -->
  <path class="rhino" d="
    M 88 84
    C 70 84, 48 96, 36 118
    C 30 130, 34 142, 48 144
    L 72 144
    C 84 144, 94 136, 96 124
    L 96 96 Z"/>
  <!-- ear -->
  <path class="rhino-dark" d="M 84 80 C 80 66, 94 62, 98 76 C 94 82, 88 84, 84 80 Z"/>
  <!-- skin folds -->
  <path class="rhino-dark" d="M 150 96 L 150 156" stroke="#4b5563" stroke-width="3" fill="none" opacity="0.5"/>
  <path class="rhino-dark" d="M 200 96 L 200 156" stroke="#4b5563" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- horns -->
  <path class="horn" d="M 40 126 C 22 114, 14 100, 18 86 C 28 100, 38 110, 48 120 Z"/>
  <path class="horn" d="M 58 110 C 54 102, 56 96, 62 92 C 64 100, 66 106, 66 110 Z"/>
  <!-- rhino eye -->
  <circle class="eye" cx="72" cy="108" r="3"/>

  <!-- oxpecker on the rhino's back, facing left, pecking -->
  <!-- body -->
  <path class="bird" d="M 190 70 C 176 70, 166 78, 166 88 C 166 94, 172 96, 180 96 L 204 96 C 214 96, 222 90, 220 82 C 218 74, 206 70, 190 70 Z"/>
  <path class="bird-belly" d="M 176 86 C 180 94, 198 96, 208 92 C 204 98, 184 98, 176 86 Z"/>
  <!-- tail -->
  <path class="bird" d="M 218 84 L 240 78 L 238 88 L 220 92 Z"/>
  <!-- head, tilted down toward the hide -->
  <circle class="bird" cx="166" cy="76" r="9"/>
  <!-- eye with the yellow ring -->
  <circle class="eyering" cx="163" cy="74" r="3.2"/>
  <circle class="eye" cx="163" cy="74" r="1.8"/>
  <!-- red beak, pecking -->
  <path class="beak" d="M 160 82 L 148 92 L 162 86 Z"/>
  <!-- legs -->
  <path d="M 184 96 L 182 104 M 196 96 L 198 104" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
